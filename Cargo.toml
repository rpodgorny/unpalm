[package]
name = "unpalm"
version = "0.1.0"
edition = "2021"
description = "Linux palm rejection filter for touchpads"
license = "GPL-3.0"
repository = "https://github.com/rpodgorny/unpalm"
homepage = "https://github.com/rpodgorny/unpalm"
authors = ["Radek Podgorny <radek@podgorny.cz>"]
rust-version = "1.78"
keywords = ["touchpad", "palm-rejection", "evdev", "linux", "input"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
evdev = "0.13"
signal-hook = "0.4"
nix = { version = "0.29", features = ["poll"] }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"
lto = true
strip = true

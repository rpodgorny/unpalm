[package]
name = "unpalm"
version = "0.1.0"
edition = "2021"
description = "Linux palm rejection filter for touchpads"
license = "GPL-3.0"
repository = "https://github.com/rpodgorny/unpalm"
rust-version = "1.78"

[dependencies]
evdev = "0.13"
signal-hook = "0.4"
nix = { version = "0.29", features = ["poll"] }
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
